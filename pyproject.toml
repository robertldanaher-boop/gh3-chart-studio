[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gh3-chart-studio"
version = "0.11.2"
description = "Authored-chart to four-fret Medium converter"
requires-python = ">=3.11,<3.12"
dependencies = ["PySide6==6.8.3", "mido==1.3.3", "numpy==2.2.4", "scipy==1.15.2", "soundfile==0.13.1", "imageio-ffmpeg==0.6.0"]

[project.scripts]
gh3-chart-studio = "gh3studio.gui:main"

[tool.setuptools.packages.find]
include = ["gh3studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
