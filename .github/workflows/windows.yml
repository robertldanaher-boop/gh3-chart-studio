# Runs native tests, signing integration and self-contained MSIX validation.
# Published releases require a real signing identity and native redistribution review.
name: Windows tests and packages

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    environment: ${{ github.event_name == 'release' && 'windows-release' || 'windows-validation' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install pinned dependencies (hash-checked)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-windows.lock

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
          GH3_NO_UPDATE_CHECK: '1'
          PYTHONUNBUFFERED: '1'
        run: python -m pytest -v --tb=short -o faulthandler_timeout=120

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path gh3studio/__init__.py -Pattern "__version__\s*=\s*'([^']+)'"
          $v = $line.Matches[0].Groups[1].Value
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Release tag must match the app version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'.TrimStart('v')
          if ($tag -ne '${{ steps.version.outputs.value }}') {
            Write-Error "Release tag v$tag does not match app version ${{ steps.version.outputs.value }}. Bump gh3studio/__init__.py or fix the tag."
            exit 1
          }

      - name: Import release signing identity
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH3_CODESIGN_PFX_BASE64: ${{ secrets.GH3_CODESIGN_PFX_BASE64 }}
          GH3_CODESIGN_PFX_PASSWORD: ${{ secrets.GH3_CODESIGN_PFX_PASSWORD }}
          GH3_CODESIGN_THUMBPRINT: ${{ secrets.GH3_CODESIGN_THUMBPRINT }}
        run: ./installer/import_ci_certificate.ps1

      - name: Build and validate self-contained MSIX bundle
        shell: pwsh
        env:
          GH3_BINARY_REDISTRIBUTION_REVIEWED: ${{ vars.GH3_BINARY_REDISTRIBUTION_REVIEWED }}
        run: |
          $python = (Get-Command python).Source
          if ('${{ github.event_name }}' -eq 'release') {
            ./packaging/build_msix.ps1 -Python $python -Release
          } else {
            ./packaging/build_msix.ps1 -Python $python -Unsigned
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build fallback Inno installer
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            ./installer/build_installer.ps1
          } else {
            ./installer/build_installer.ps1 -Unsigned
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: GH3ChartStudio-package-validation-${{ steps.version.outputs.value }}
          path: packaging/output/*.json
          if-no-files-found: error

      - name: Upload fallback installer
        uses: actions/upload-artifact@v4
        with:
          name: GH3ChartStudio-Setup-${{ steps.version.outputs.value }}-${{ github.event_name == 'release' && 'signed' || 'unsigned' }}
          path: installer/output/*.exe
          if-no-files-found: error

      # Native dependency source/relinking review is required before redistributing
      # the self-contained binary. PR CI validates it privately and uploads reports only.
      - name: Upload signed MSIX release artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: GH3ChartStudio-MSIX-${{ steps.version.outputs.value }}-signed
          path: |
            packaging/output/*.msixbundle
            packaging/output/*.signing.json
          if-no-files-found: error

      - name: Publish verified MSIX bundle
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundles = @(Get-ChildItem packaging/output/*.msixbundle)
          if ($bundles.Count -ne 1 -or $bundles[0].Name -match 'unsigned') { throw 'Exactly one signed release bundle is required' }
          ./installer/sign.ps1 -Path $bundles[0].FullName -VerifyOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "${{ github.event.release.tag_name }}" $bundles[0].FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove temporary signing identity
        if: always() && github.event_name == 'release'
        shell: pwsh
        run: |
          if ($env:GH3_IMPORTED_CERTIFICATE) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:GH3_IMPORTED_CERTIFICATE" -DeleteKey -Force -ErrorAction Stop
          }
